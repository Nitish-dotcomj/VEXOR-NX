services:
  - type: web
    name: vexor-nx
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_NAME
        value: qwen2.5:3b
      # Set OLLAMA_URL only after deploying a separately hosted Ollama-compatible service.
